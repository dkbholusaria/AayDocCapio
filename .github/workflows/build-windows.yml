name: Build Windows Installers

# Triggers:
#   1. Push a tag like v1.4.1  →  builds + attaches installers to GitHub Release
#   2. Actions tab → Run workflow  →  manual test build
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    name: Build Windows Executable + Installers
    runs-on: windows-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout source
        uses: actions/checkout@v4

      # ── 2. Python ──────────────────────────────────────────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ── 3. Get version from version.py ────────────────────────────────────
      - name: Get version
        id: ver
        run: |
          $v = python -c "from version import __version__; print(__version__)"
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        shell: pwsh

      # ── 4. Install runtime + build deps ────────────────────────────────────
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nuitka ordered-set zstandard

      # ── 4. Install Playwright Chromium ─────────────────────────────────────
      - name: Install Playwright browsers
        run: playwright install chromium

      # ── 5. Smoke test ──────────────────────────────────────────────────────
      - name: Smoke test
        run: |
          python -c "
          import app
          from automation import browser, downloader, downloader_26as, downloader_ais_tis, as26_converter
          from vault import VaultManager
          print('All imports OK')
          "

      # ── 6. Nuitka compile ──────────────────────────────────────────────────
      - name: Build with Nuitka
        run: |
          python -m nuitka `
            --standalone `
            --windows-console-mode=disable `
            --windows-icon-from-ico=resources\app_icon.ico `
            --output-dir=dist `
            --output-filename=AayDocCapio.exe `
            --include-data-dir=resources=resources `
            --include-data-file=assessment_years.json=assessment_years.json `
            --include-package=automation `
            --include-module=vault `
            --include-module=themes `
            --enable-plugin=pyqt6 `
            --assume-yes-for-downloads `
            app.py

      # ── 7. Rename dist folder ──────────────────────────────────────────────
      - name: Rename output folder
        run: |
          if (Test-Path "dist\app.dist") { Rename-Item "dist\app.dist" "AayDocCapio" }

      # ── 8. Inno Setup installer (.exe) ─────────────────────────────────────
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build Inno Setup installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion="${{ steps.ver.outputs.VERSION }}" scripts\installer.iss
        shell: pwsh

      # ── 9. WiX installer (.msi) ────────────────────────────────────────────
      - name: Install WiX Toolset
        run: |
          dotnet tool install --global wix
          $env:PATH += ";$env:USERPROFILE\.dotnet\tools"
          wix eula accept wix7
          wix extension add WixToolset.UI.wixext --global
        shell: pwsh

      - name: Build WiX MSI installer
        run: |
          $env:PATH += ";$env:USERPROFILE\.dotnet\tools"
          wix build scripts\installer.wxs `
            -d Version=${{ steps.ver.outputs.VERSION }} `
            -out installer_output\AayDocCapio_Setup_v${{ steps.ver.outputs.VERSION }}.msi `
            -ext WixToolset.UI.wixext `
            -arch x64
        shell: pwsh

      # ── 10. Upload artifacts ───────────────────────────────────────────────
      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: AayDocCapio-windows-installers-v${{ steps.ver.outputs.VERSION }}
          path: |
            installer_output\AayDocCapio_Setup_v${{ steps.ver.outputs.VERSION }}.exe
            installer_output\AayDocCapio_Setup_v${{ steps.ver.outputs.VERSION }}.msi
          retention-days: 30

      # ── 11. Attach to GitHub Release ───────────────────────────────────────
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer_output\AayDocCapio_Setup_v${{ steps.ver.outputs.VERSION }}.exe
            installer_output\AayDocCapio_Setup_v${{ steps.ver.outputs.VERSION }}.msi
          generate_release_notes: true
