name: Build macOS App

# Triggers:
#   1. Push a tag like v1.4.0  →  builds + attaches .zip to a GitHub Release
#   2. Actions tab → Run workflow  →  manual test build (no release created)
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-macos:
    name: Build macOS App Bundle
    runs-on: macos-latest        # Apple Silicon (arm64) runner

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout source
        uses: actions/checkout@v4

      # ── 2. Python ──────────────────────────────────────────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ── 3. Install runtime + build deps ────────────────────────────────────
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # ── 4. Install Playwright Chromium ─────────────────────────────────────
      - name: Install Playwright browsers
        run: playwright install chromium

      # ── 5. Smoke test — make sure the app imports cleanly ──────────────────
      - name: Smoke test
        run: |
          python -c "
          import app
          import as26_converter
          from automation import browser, downloader, downloader_26as, downloader_ais_tis
          from vault import VaultManager
          print('All imports OK')
          "

      # ── 6. PyInstaller compile → .app bundle ───────────────────────────────
      - name: Build with PyInstaller
        run: |
          pyinstaller \
            --windowed \
            --noconfirm \
            --name AayDocCapio \
            --add-data "resources:resources" \
            --add-data "assessment_years.json:." \
            --collect-submodules automation \
            --hidden-import vault \
            --hidden-import as26_converter \
            --hidden-import themes \
            app.py

      # ── 7. Verify app bundle ───────────────────────────────────────────────
      - name: Verify app bundle
        run: |
          ls dist/
          test -d dist/AayDocCapio.app

      # ── 8. Copy Playwright browsers into the bundle ─────────────────────────
      # Playwright looks for browsers relative to the executable. Bundle them
      # so the app works without a separate `playwright install` on the user's Mac.
      - name: Bundle Playwright browsers
        run: |
          BROWSERS_SRC="$HOME/Library/Caches/ms-playwright"
          BUNDLE_RESOURCES="dist/AayDocCapio.app/Contents/Resources"
          if [ -d "$BROWSERS_SRC" ]; then
            mkdir -p "$BUNDLE_RESOURCES/ms-playwright"
            # Copy only chromium (skip firefox/webkit to keep size down)
            find "$BROWSERS_SRC" -maxdepth 1 -name "chromium*" -exec cp -r {} "$BUNDLE_RESOURCES/ms-playwright/" \;
            echo "Chromium bundled."
          else
            echo "WARNING: Playwright browser cache not found at $BROWSERS_SRC — skipping bundle step."
          fi

      # ── 9. Launch test — verify app starts and doesn't crash immediately ──────
      - name: Launch test
        run: |
          echo "Launching AayDocCapio.app..."
          open dist/AayDocCapio.app
          # Give the app up to 15 seconds to appear in the process list
          for i in $(seq 1 15); do
            if pgrep -x "AayDocCapio" > /dev/null 2>&1; then
              echo "App is running (attempt $i)"
              break
            fi
            echo "Waiting... ($i/15)"
            sleep 1
          done
          if ! pgrep -x "AayDocCapio" > /dev/null 2>&1; then
            echo "ERROR: AayDocCapio process not found after 15 seconds — app likely crashed on launch."
            # Print crash logs if any
            find ~/Library/Logs/DiagnosticReports -name "AayDocCapio*" -newer dist/AayDocCapio.app 2>/dev/null | head -3 | xargs -I{} cat {} 2>/dev/null || true
            exit 1
          fi
          echo "Launch test passed. Stopping app."
          pkill -x "AayDocCapio" || true
          sleep 2

      # ── 10. Zip the .app for distribution ──────────────────────────────────
      - name: Zip app bundle
        run: |
          cd dist
          zip -r --symlinks AayDocCapio-macos-arm64-v1.4.0.zip AayDocCapio.app
          echo "Archive size: $(du -sh AayDocCapio-macos-arm64-v1.4.0.zip | cut -f1)"

      # ── 11. Upload artifact (always available for download) ─────────────────
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AayDocCapio-macos-arm64-v1.4.0
          path: dist/AayDocCapio-macos-arm64-v1.4.0.zip
          retention-days: 30

      # ── 12. Attach to GitHub Release (only when triggered by a version tag) ─
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AayDocCapio-macos-arm64-v1.4.0.zip
          generate_release_notes: false
