name: Feature request
description: Suggest a new feature or improvement for AayDocCapio.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ![AayDocCapio](https://download.aaydoccapio.com/AayDoc_FullLogo.png)

        # New Feature Request

        Use this form to suggest an improvement to AayDocCapio.

        Maintainer follow-up questions, if any, will be asked publicly in this GitHub issue thread. Do not post passwords, PANs, taxpayer records, or other sensitive information. If private discussion is required, use the official support/contact channel instead of posting confidential details here.
  - type: textarea
    id: problem
    attributes:
      label: Problem or workflow gap
      description: What are you trying to do, and what is difficult today?
      placeholder: "When handling..."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the feature or behaviour you want.
      placeholder: "Add an option to..."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional. Mention any workaround you use today.
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - Nice to have
        - Important
        - Critical for my workflow
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I am submitting this request voluntarily and confirm this submission does not contain personal data as defined under the Digital Personal Data Protection Act, 2023, including but not limited to PANs, Aadhar, personal identifiable information, passwords, taxpayer records, and/or any other confidential information.
          required: true
