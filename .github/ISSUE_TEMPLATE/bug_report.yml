name: Bug report
description: Report something that is not working in AayDocCapio.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Do not include passwords, client PANs, or other private taxpayer data.
  - type: input
    id: version
    attributes:
      label: AayDocCapio version
      description: Find this in the app footer or Help -> About AayDocCapio.
      placeholder: "v1.7.2"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - macOS
        - Linux / WSL
        - Other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the failure or unexpected behaviour.
      placeholder: "The app showed..."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the exact steps that trigger the problem.
      placeholder: |
        1. Open...
        2. Select...
        3. Click...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
      placeholder: "I expected..."
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      placeholder: "Instead..."
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Paste only non-sensitive logs. Remove passwords, PANs, and taxpayer details.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I am submitting this request voluntarily and confirm this submission does not contain personal data as defined under the Digital Personal Data Protection Act, 2023, including PANs, passwords, taxpayer records, or any other confidential information.
          required: true
